services:
  db:
    image: postgres:latest
    container_name: pei-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pei
      POSTGRES_PASSWORD: pei
      POSTGRES_DB: pei

  pgadmin:
    image: dpage/pgadmin4
    container_name: pei-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pei.com
      PGADMIN_DEFAULT_PASSWORD: pei
    depends_on:
      - db

services:
  db:
    image: postgres:18.3
    container_name: labpoint-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: labpoint
      POSTGRES_PASSWORD: labpoint
      POSTGRES_DB: labpoint

  pgadmin:
    image: dpage/pgadmin4
    container_name: labpoint-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@labpoint.com
      PGADMIN_DEFAULT_PASSWORD: labpoint
    depends_on:
      - db

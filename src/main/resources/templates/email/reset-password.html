<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
<div style="max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
  <h2 style="color: #1a1a1a;">Redefinição de senha</h2>
  <p>Recebemos uma solicitação para redefinir a senha da sua conta no LabPoint.</p>
  <p>Clique no botão abaixo para criar uma nova senha. Este link expira em 30 minutos.</p>

  <div style="text-align: center; margin: 32px 0;">
    <a th:href="${link}"
       style="background-color: #2563eb; color: #ffffff; padding: 12px 24px;
                      text-decoration: none; border-radius: 6px; display: inline-block;">
      Redefinir senha
    </a>
  </div>

  <p style="font-size: 13px; color: #666;">
    Se você não solicitou essa redefinição, pode ignorar este email com segurança.
  </p>
</div>
</body>
</html>
